name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNFS.sln

      - name: Build
        run: dotnet build src/OpenNFS.sln -c Release --no-restore

      - name: Validate release checklist and plan
        shell: pwsh
        run: |
          ./scripts/release/Assert-ReleaseChecklist.ps1
          ./scripts/release/Assert-RepositoryHonesty.ps1
          ./scripts/release/Invoke-ReleaseValidation.ps1 -PlanOnly -IncludePack

      - name: Pack OpenNFS.Server
        run: dotnet pack src/OpenNFS.Server/OpenNFS.Server.csproj -c Release --no-build

      - name: Pack OpenNFS.Client
        run: dotnet pack src/OpenNFS.Client/OpenNFS.Client.csproj -c Release --no-build
