name: interop-hosted

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  interop-hosted:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNFS.sln

      - name: Build
        run: dotnet build src/OpenNFS.sln -c Release --no-restore

      - name: Enforce no explicit skipped tests
        shell: pwsh
        run: ./scripts/release/Assert-NoSkippedTests.ps1

      - name: Run Docker-backed automated interop matrix
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Release --no-build --framework net8.0 -- --results artifacts/touchstone-results.json

      - name: Create synthetic conformance smoke roots
        shell: bash
        run: |
          mkdir -p artifacts/conformance-smoke/pjdfstest/tests
          mkdir -p artifacts/conformance-smoke/connectathon/tests
          mkdir -p artifacts/conformance-smoke/pynfs
          cat <<'EOF' > artifacts/conformance-smoke/pjdfstest/tests/smoke.t
          use strict;
          use warnings;
          my $mount = $ENV{OPENNFS_MOUNT_POINT} // q{};
          print "1..2\n";
          if (-d $mount) { print "ok 1 - mount exists\n"; } else { print "not ok 1 - mount exists\n"; exit 1; }
          if (-f "$mount/hello.txt") { print "ok 2 - seeded file visible\n"; } else { print "not ok 2 - seeded file visible\n"; exit 1; }
          EOF
          cat <<'EOF' > artifacts/conformance-smoke/connectathon/tests/general.t
          use strict;
          use warnings;
          my $mount = $ENV{OPENNFS_MOUNT_POINT} // q{};
          print "1..2\n";
          if (-d $mount) { print "ok 1 - mount exists\n"; } else { print "not ok 1 - mount exists\n"; exit 1; }
          if (-f "$mount/hello.txt") { print "ok 2 - seeded file visible\n"; } else { print "not ok 2 - seeded file visible\n"; exit 1; }
          EOF
          cat <<'EOF' > artifacts/conformance-smoke/pynfs/entry.py
          import os
          import socket
          host = os.environ["OPENNFS_SERVER_HOST"]
          port = int(os.environ["OPENNFS_SERVER_PORT"])
          with socket.create_connection((host, port), timeout=5):
              pass
          print("PYNFS SYNTHETIC OK")
          EOF

      - name: Run synthetic pjdfstest wrapper smoke
        shell: pwsh
        run: ./scripts/interop/pjdfstest/Invoke-Pjdfstest.ps1 -ProtocolVersion NfsV3 -ExportPath /exports/sample -MountPoint /mnt/opennfs -ResultsDirectory artifacts/pjdfstest-smoke -SuiteRoot artifacts/conformance-smoke/pjdfstest -Subset smoke -UseSampleServer

      - name: Run synthetic Connectathon wrapper smoke
        shell: pwsh
        run: ./scripts/interop/connectathon/Invoke-Connectathon.ps1 -ProtocolVersion NfsV3 -ExportPath /exports/sample -MountPoint /mnt/opennfs -ResultsDirectory artifacts/connectathon-smoke -SuiteRoot artifacts/conformance-smoke/connectathon -Subset general -UseSampleServer

      - name: Run synthetic pynfs wrapper smoke
        shell: pwsh
        run: ./scripts/interop/pynfs/Invoke-Pynfs.ps1 -MinorVersion 0 -ExportPath /exports/sample -ResultsDirectory artifacts/pynfs-smoke -SuiteRoot artifacts/conformance-smoke/pynfs -EntryPoint entry.py -UseSampleServer

      - name: Plan upstream pjdfstest integration
        shell: pwsh
        run: ./scripts/interop/pjdfstest/Invoke-Pjdfstest.ps1 -PlanOnly -ProtocolVersion NfsV3 -ServerHost sample-host -ExportPath /exports/sample -MountPoint /mnt/opennfs -ResultsDirectory artifacts/pjdfstest

      - name: Plan upstream Connectathon integration
        shell: pwsh
        run: ./scripts/interop/connectathon/Invoke-Connectathon.ps1 -PlanOnly -ProtocolVersion NfsV3 -ServerHost sample-host -ExportPath /exports/sample -MountPoint /mnt/opennfs -ResultsDirectory artifacts/connectathon

      - name: Plan upstream pynfs integration
        shell: pwsh
        run: ./scripts/interop/pynfs/Invoke-Pynfs.ps1 -PlanOnly -MinorVersion 0 -ServerHost sample-host -ExportPath /exports/sample -ResultsDirectory artifacts/pynfs

      - name: Upload hosted interop artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-interop-results
          path: artifacts
          if-no-files-found: error
