name: test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNFS.sln

      - name: Build
        run: dotnet build src/OpenNFS.sln -c Release --no-restore

      - name: Validate XDR manifest
        run: dotnet run --project src/OpenNFS.XdrGen/OpenNFS.XdrGen.csproj -- --check --config src/OpenNFS.XdrGen/xdrgen.json

      - name: Run Touchstone automated runner
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -- --results artifacts/touchstone-results.json

      - name: Run xUnit adapter
        run: dotnet test src/Test.Xunit/Test.Xunit.csproj -c Release --no-build

      - name: Run NUnit adapter
        run: dotnet test src/Test.Nunit/Test.Nunit.csproj -c Release --no-build

