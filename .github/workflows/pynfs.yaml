name: pynfs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  pynfs:
    runs-on:
      - self-hosted
      - linux
      - privileged

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNFS.sln

      - name: Build
        run: dotnet build src/OpenNFS.sln -c Release --no-restore

      - name: Enforce no explicit skipped tests
        shell: pwsh
        run: ./scripts/release/Assert-NoSkippedTests.ps1

      - name: Execute real pynfs NFSv4.0 integration
        shell: pwsh
        run: |
          $pynfsRoot = if ($env:PYNFS_ROOT) { $env:PYNFS_ROOT } else { 'scripts/interop/pynfs/external' }
          if ($env:PYNFS_ENTRYPOINT) {
            ./scripts/interop/pynfs/Invoke-Pynfs.ps1 -MinorVersion 0 -ExportPath /exports/sample -ResultsDirectory artifacts/pynfs-v40 -SuiteRoot $pynfsRoot -EntryPoint $env:PYNFS_ENTRYPOINT -UseSampleServer
          }
          else {
            ./scripts/interop/pynfs/Invoke-Pynfs.ps1 -MinorVersion 0 -ExportPath /exports/sample -ResultsDirectory artifacts/pynfs-v40 -SuiteRoot $pynfsRoot -UseSampleServer
          }

      - name: Execute real pynfs NFSv4.1 integration
        shell: pwsh
        run: |
          $pynfsRoot = if ($env:PYNFS_ROOT) { $env:PYNFS_ROOT } else { 'scripts/interop/pynfs/external' }
          if ($env:PYNFS41_ENTRYPOINT) {
            ./scripts/interop/pynfs/Invoke-Pynfs.ps1 -MinorVersion 1 -ExportPath /export -ResultsDirectory artifacts/pynfs-v41 -SuiteRoot $pynfsRoot -EntryPoint $env:PYNFS41_ENTRYPOINT -UseLinuxNfs41Server
          }
          else {
            ./scripts/interop/pynfs/Invoke-Pynfs.ps1 -MinorVersion 1 -ExportPath /export -ResultsDirectory artifacts/pynfs-v41 -SuiteRoot $pynfsRoot -UseLinuxNfs41Server
          }

      - name: Upload pynfs planning artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pynfs-results
          path: |
            artifacts/pynfs-v40
            artifacts/pynfs-v41
          if-no-files-found: ignore
