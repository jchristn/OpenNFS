global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # OpenNFS metrics arrive over OTLP at the collector, which re-exposes them here. The job and instance labels
  # carry the emitting service.name and service.instance.id.
  - job_name: 'opennfs'
    honor_labels: true
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']
